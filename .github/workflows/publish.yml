name: Publish to GitHub Packages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build and install to local repo
        run: mvn clean install -DskipTests

      - name: Publish to GitHub Packages
        run: mvn deploy -DskipTests -DserverId=github -DserverUsername=${{ github.actor }} -DserverPassword=${{ secrets.GITHUB_TOKEN }}
